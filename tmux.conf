set -ga terminal-overrides ",screen-255color*:Tc"
set-option -g default-terminal "screen-256color"
set -s escape-time 0

unbind C-b
#set-option -g prefix C-a
#bind-key C-a send-prefix
set-option -g prefix C-space
bind-key C-space send-prefix
#set -g status-style 'bg=#1a1a1a fg=#cccccc'

set -g status-style 'bg=colour232 fg=colour250'
set -g status-left "#[bg=colour232,fg=colour255,bold] #S #[bg=colour232,fg=colour108]"
set -g status-left-length 30
set -g window-status-current-style 'bg=colour22,fg=colour255,bold'
set -g window-status-current-format ' #I:#W '
set -g window-status-style 'bg=colour232,fg=colour245'
set -g window-status-format ' #I:#W '
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour108'
set -g message-style 'bg=colour22,fg=colour255,bold'
set -g message-command-style 'bg=colour52,fg=colour255,bold'

set -g mouse on

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"
set -g base-index 1

set-option -g default-shell "$SHELL"
set-option -g update-environment "DISPLAY SSH_AUTH_SOCK SSH_CONNECTION WINDOWID XAUTHORITY WAYLAND_DISPLAY DBUS_SESSION_BUS_ADDRESS"

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind C-c copy-mode \; send-keys -X begin-selection
# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# selecionar panes sem prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Trocar janela com as setinhas
bind -n M-Right next-window
bind -n M-Left previous-window

bind-key -n MouseDown1StatusLeft choose-tree -s

# d → detach
bind D detach-client

# w → window list
bind W choose-window

# f → find text
bind F copy-mode \; send-keys /

# Horizontal pane - Ctrl+a " (default behavior)
bind '"' split-window -v

bind d choose-tree -s

# Vertical pane - Ctrl+a v (your request)
bind a split-window -h
bind v split-window -h -c "#{pane_current_path}"

# Leader + w: kill current pane with confirmation
bind w confirm-before -p "Kill pane #P? (y/n)" kill-pane

# Leader + b: split horizontally (new pane at bottom)
bind b split-window -v -c "#{pane_current_path}"

bind X kill-session
bind K confirm-before -p "Close ALL? (y/n)" kill-server
bind S new-session -c "#{pane_current_path}" -s %

bind -T copy-mode-vi MouseDragEnd1Pane send-keys
unbind -T copy-mode-vi MouseDragEnd1Pane
# ===== FUZZY FINDER PARA PROJETOS/PASTAS =====

# f - Buscar projetos/pastas e abrir na janela atual (Ctrl+a f)
bind f display-popup -h 70% -w 85% -E "\
  selected=\$(find ~/ ~/Documents ~/projetos ~/dev ~/workspace \
    -maxdepth 5 -type d \
    \\( -name .git -o -name node_modules -o -name dist -o -name build -o -name .pyenv -o -path '*/.local/state'\
       -o -name .cache -o -name .npm -o -name .cargo -o -name .rustup -o -name .nvm -o -path '*/.local/share' \
    \\) -prune -o -print 2>/dev/null \
    | fzf --reverse --height 100% \
    --preview='ls -la {}' \
    --header='󰝰  Projects and files' \
    --prompt='󰍉  Search > '); \
  if [ -n \"\$selected\" ]; then \
    tmux rename-window \"\$(basename \"\$selected\")\"; \
    tmux send-keys \"cd \\\"\$selected\\\"\" C-m C-l; \
  fi"

# o - Abrir pasta em nova janela E renomear a janela
bind i display-popup -h 70% -w 85% -E "\
  selected=\$(find ~/ \
    -maxdepth 5 -type d \
    \\( -name .git -o -name node_modules -o -name dist -o -name build -o -name .pyenv -o -path '*/.local/state' \
       -o -name .cache -o -name .npm -o -name .cargo -o -name .rustup -o -name .nvm -o -path '*/.local/share' \
    \\) -prune -o -print 2>/dev/null \
    | fzf --reverse --height 100% \
    --preview='ls -la {}' \
    --header='󰝰  Open in another TAB'); \
  if [ -n \"\$selected\" ]; then \
    window_name=\$(basename \"\$selected\"); \
    tmux new-window -c \"\$selected\" -n \"\$window_name\"; \
  fi"

bind / command-prompt -p "Google:" \
  "run-shell 'xdg-open \"https://www.google.com/search?q=%%\" >/dev/null 2>&1 &'"

# IA
bind i display-popup -h 70% -w 80% -E "~/.local/bin/tmux-ai"

# g - Clonar repo do GitHub (Ctrl+c g) - versão estável
bind g display-popup -h 40% -w 70% -E bash -c '
echo "󰊤  Format: usr/repo"
echo
read -p "GitHub: " repo

if [ -z "$repo" ]; then
  exit 0
fi

BASE=~/projects
[ -d "$BASE" ] || BASE=~

cd "$BASE" || exit 1

url="https://github.com/$repo.git"
name=$(basename "$repo")

echo
echo "Clonig $url ..."
echo

git clone "$url" || exit 1
cd "$name" || exit 1

tmux rename-window "$name"
tmux send-keys "cd \"$PWD\"" C-m C-l

echo
echo "✔ Repo cloned! Press ENTER to close..."
read
'

