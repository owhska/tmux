set -ga terminal-overrides ",screen-255color*:Tc"
set-option -g default-terminal "screen-256color"
set -s escape-time 0

unbind C-b
#set-option -g prefix C-a
#bind-key C-a send-prefix
#set-option -g prefix C-space
#bind-key C-space send-prefix
set-option -g prefix C-c
bind-key C-c send-prefix
set -g status-style 'bg=#1a1a1a fg=#cccccc'
set -g mouse on

bind r source-file ~/.config/tmux/tmux.conf
set -g base-index 1

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

bind -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind C-c copy-mode \; send-keys -X begin-selection

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# selecionar panes sem prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Horizontal pane - Ctrl+a " (default behavior)
bind '"' split-window -v

# Vertical pane - Ctrl+a v (your request)
bind a split-window -h
bind v split-window -h -c "#{pane_current_path}"

# Leader + w: kill current pane with confirmation
bind w confirm-before -p "Kill pane #P? (y/n)" kill-pane

# Leader + b: split horizontally (new pane at bottom)
bind b split-window -v -c "#{pane_current_path}"

bind / command-prompt -p "Google:" \
  "run-shell 'xdg-open \"https://www.google.com/search?q=%%\" >/dev/null 2>&1 &'"

# ===== FUZZY FINDER PARA PROJETOS/PASTAS =====

# f - Buscar projetos/pastas e abrir na janela atual (Ctrl+a f)
bind f display-popup -h 70% -w 85% -E "\
  selected=\$(find ~/ ~/Documents ~/projetos ~/dev ~/workspace -type d -maxdepth 3 2>/dev/null \
    | fzf --reverse --height 100% \
    --preview='ls -la {}' \
    --header='󰝰  Projects and files' \
    --prompt='󰍉  Search > '); \
  if [ -n \"\$selected\" ]; then \
    tmux rename-window \"\$(basename \"\$selected\")\"; \
    tmux send-keys \"cd \\\"\$selected\\\"\" C-m C-l; \
  fi"

# s - Seu sessionizer original (se ainda quiser mantê-lo)
bind s display-popup -h 70% -w 85% -E "tmux neww ~/.local/bin/tmux-sessionizer"

# o - Apenas abrir pasta em nova janela (sem criar sessão)
#bind o display-popup -h 70% -w 85% -E "\
  selected=\$(find ~/ -type d 2>/dev/null | fzf --reverse --height 100% \
    --preview='ls -la {}' \
    --header='󰝰  Open in another tab'); \
  if [ -n \"\$selected\" ]; then \
    tmux new-window -c \"\$selected\"; \
  fi"

# o - Abrir pasta em nova janela E renomear a janela
bind o display-popup -h 70% -w 85% -E "\
  selected=\$(find ~/ -type d 2>/dev/null | fzf --reverse --height 100% \
    --preview='ls -la {}' \
    --header='󰝰  Open in another TAB'); \
  if [ -n \"\$selected\" ]; then \
    window_name=\$(basename \"\$selected\"); \
    tmux new-window -c \"\$selected\" -n \"\$window_name\"; \
  fi"

# s - Seu sessionizer original (se ainda quiser mantê-lo)
bind s display-popup -h 70% -w 85% -E "tmux neww ~/.local/bin/tmux-sessionizer"

# g - Clonar repo do GitHub (Ctrl+c g) - versão estável
bind g display-popup -h 40% -w 70% -E bash -c '
echo "󰊤  Format: usr/repo"
echo
read -p "GitHub: " repo

if [ -z "$repo" ]; then
  exit 0
fi

BASE=~/projects
[ -d "$BASE" ] || BASE=~

cd "$BASE" || exit 1

url="https://github.com/$repo.git"
name=$(basename "$repo")

echo
echo "Clonig $url ..."
echo

git clone "$url" || exit 1
cd "$name" || exit 1

tmux rename-window "$name"
tmux send-keys "cd \"$PWD\"" C-m C-l

echo
echo "✔ Repo cloned! Press ENTER to close..."
read
'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys
unbind -T copy-mode-vi MouseDragEnd1Pane
